name: Generate PM Digest

on:
  schedule:
    - cron: "0 20 * * 1"   # Every Monday    2 PM MDT (UTC-6) / 1 PM MST (UTC-7)
    - cron: "0 20 * * 4"   # Every Thursday  same
  workflow_dispatch:        # Also lets you trigger it manually from GitHub

permissions:
  contents: write           # Needed so the action can commit digests/ back to the repo
  issues: write             # Needed to open a failure-notification issue

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install anthropic duckduckgo-search feedparser

      - name: Generate digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: viviankillin@gmail.com
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TZ: America/Denver
        run: python generate_digest.py

      - name: Commit and push new digest
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add digests/
          git diff --staged --quiet || git commit -m "Digest update $(date +'%Y-%m-%d')"
          git push

      # ── Runs only when any previous step fails ──────────────────────────────
      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const run_url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `Digest generation failed — ${new Date().toDateString()}`,
              body:  `The scheduled PM Intel Digest run failed.\n\n**[View the full logs here](${run_url})**\n\nCommon causes: API key expired, DuckDuckGo rate limit, or a Python error. Check the logs and re-run manually once fixed.`,
              labels: ["bug"]
            })
