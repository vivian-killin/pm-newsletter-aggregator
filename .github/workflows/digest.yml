name: Generate PM Digest

on:
  schedule:
    - cron: "0 20 * * 1"   # Every Monday    2 PM MDT (UTC-6) / 1 PM MST (UTC-7)
    - cron: "0 20 * * 4"   # Every Thursday  same
  workflow_dispatch:        # Also lets you trigger it manually from GitHub

permissions:
  contents: write           # Needed so the action can commit index.html back to the repo

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install anthropic duckduckgo-search

      - name: Generate digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate_digest.py

      - name: Commit and push new digest
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add digests/
          git diff --staged --quiet || git commit -m "Digest update $(date +'%Y-%m-%d')"
          git push
